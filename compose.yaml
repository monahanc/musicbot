services:
  rubychan:
    build:
      context: .
      target: bot
    image: rubychan:latest
    container_name: rubychan
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      WHISPER_URL: ${WHISPER_URL:-http://kasupc:8000}
    volumes:
      - type: bind
        source: /home/rubychan/uploads
        target: /app/uploads
      - type: bind
        source: /home/rubychan/audio
        target: /app/audio
        read_only: true

  whisper:
    profiles: ["whisper"]
    build:
      context: .
      target: whisper
    image: rubychan-whisper:latest
    container_name: rubychan-whisper
    restart: always
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
