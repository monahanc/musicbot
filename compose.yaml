services:
  rubychan:
    image: registry.connormonahan.net/rubychan:latest
    container_name: rubychan
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      WHISPER_URL: https://kasupc:8000
      WHISPER_CERT_FILE: /app/certs/cert.pem
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - type: bind
        source: /home/rubychan/uploads
        target: /app/uploads
      - type: bind
        source: /home/rubychan/certs
        target: /app/certs
        read_only: true
